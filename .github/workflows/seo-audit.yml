name: SEO and AI-search health
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 04 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: vars.SEO_AUDIT_URLS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEO_AUDIT_URLS: ${{ vars.SEO_AUDIT_URLS }}
      SEO_FAIL_ON: ${{ vars.SEO_FAIL_ON || 'critical' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Audit configured URLs
        shell: bash
        run: |
          set -euo pipefail
          case "$SEO_FAIL_ON" in none|warning|critical) ;; *) exit 2 ;; esac
          count=0
          failed=0
          while IFS= read -r url; do
            url="${url%$'\r'}"
            [[ -z "$url" ]] && continue
            count=$((count + 1))
            if (( count > 10 )); then
              echo '::error::Configure no more than ten URLs.'
              exit 2
            fi
            out="runs/ci/target-$count"
            args=()
            baseline=".github/seo-baselines/target-$count.json"
            [[ ! -f "$baseline" ]] || args+=(--baseline "$baseline")
            status=0
            # Leave time for paced first-party asset requests on slower runners.
            automate-seo health --url="$url" --mode browser --browser-assets allowlist \
              --timeout 90 --max-pages 10 \
              --out "$out" --fail-on "$SEO_FAIL_ON" "${args[@]}" || status=$?
            if [[ -f "$out/health.md" ]]; then
              cat "$out/health.md" >> "$GITHUB_STEP_SUMMARY"
            fi
            if (( status != 0 )); then
              echo "::error::SEO health check failed for configured target $count (exit $status)."
              failed=1
            fi
          done <<< "$SEO_AUDIT_URLS"
          if (( count == 0 )); then
            echo '::error::No audit URLs were configured.'
            exit 2
          fi
          exit "$failed"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seo-health
          path: |
            runs/ci/target-*/health.json
            runs/ci/target-*/health.md
            runs/ci/target-*/health.html
          if-no-files-found: warn
          retention-days: 14
